[project]
name = "hanoi-redemption"
version = "1.0.0"
description = "A reproducible Towers of Hanoi benchmark for OpenAI models"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0.0,<4",
    "pydantic>=2.12.0,<3",
    "python-dotenv>=1.0.0,<2",
    "rich>=14.0.0,<15",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "ruff>=0.12.0,<1",
]

[project.scripts]
hanoi = "hanoi_redemption.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
